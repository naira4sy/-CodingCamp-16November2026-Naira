<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
    <div class="logo"><img src="441071357282826181.jpg" style="width:100%;height:90%;object-fit:contain;transform:none;"></div>
      <div>
        <p class="brand-title">Naira's Dashboard</p>
        <p class="brand-sub">Life Dashboard</p>
      </div>
    </div>
   <button id="theme-toggle" class="theme-btn" aria-label="Ganti tema">🌙</button>
  </header>

  <main class="wrap">
    <!-- Greeting -->
    <section class="card hero">
      <div class="hero-left">
        <p id="greeting" class="greeting">Good Morning</p>
        <p id="clock" class="clock">00:00</p>
        <p id="date" class="date">Loading…</p>
      </div>
      <div class="hero-right">
        <label for="name-input" class="label">Your name</label>
        <div class="row">
          <input id="name-input" type="text" maxlength="30" placeholder="Enter your name">
          <button id="save-name" class="btn btn-gold">Save</button>
        </div>
      </div>
    </section>

    <!-- Timer -->
    <section class="card accent timer-card">
      <h2 class="card-title">⏳ Pomodoro Timer</h2>
      <div class="ring">
        <svg viewBox="0 0 160 160" aria-hidden="true">
          <circle class="ring-track" cx="80" cy="80" r="70"></circle>
          <circle id="ring-bar" class="ring-bar" cx="80" cy="80" r="70"></circle>
        </svg>
        <p id="timer-display" class="timer">25:00</p>
      </div>
      <p id="timer-msg" class="timer-msg" role="status"></p>
      <div class="row center">
        <button id="timer-start" class="btn btn-navy">▶ Start</button>
        <button id="timer-stop" class="btn btn-soft" disabled>▮▮ Stop</button>
        <button id="timer-reset" class="btn btn-soft">↻ Reset</button>
      </div>
           <label for="duration" class="label">Duration (minutes)</label>
      <div class="row">
        <input id="duration" type="number" min="1" max="60" placeholder="1–60" class="short">
        <button id="duration-set" class="btn btn-navy">Set</button>
      </div>
    </section>

    <!-- Motivation -->
    <section class="card quote-card">
      <div class="quote-head">
        <h2 class="card-title">🌟 Daily Motivation</h2>
        <span id="streak" class="pill">🔥 1 day streak</span>
      </div>
      <blockquote class="quote">
        <p id="quote-text">Loading…</p>
        <cite id="quote-author"></cite>
      </blockquote>
      <div class="progress-row">
        <button id="next-quote" class="btn btn-gold">Next quote →</button>
        <div class="progress-wrap">
          <p class="label light">Today's progress <span id="progress-text"></span></p>
          <div class="bar"><div id="progress-bar" class="bar-fill"></div></div>
        </div>
      </div>
    </section>

    <!-- Tasks + Links -->
    <section class="two">
      <article class="card accent">
        <h2 class="card-title">✓ Tasks</h2>
        <div class="row">
          <input id="todo-input" type="text" maxlength="100" placeholder="Add a task..." aria-label="Add a task">
          <button id="todo-add" class="btn btn-navy">Add</button>
        </div>
        <p id="todo-msg" class="msg" role="alert"></p>
        <ul id="todo-list" class="todo-list"></ul>
      </article>

      <article class="card">
        <h2 class="card-title">🔗 Quick Links</h2>
        <label for="link-name" class="label">Label</label>
        <input id="link-name" type="text" maxlength="30" placeholder="e.g. Classroom">
        <label for="link-url" class="label">URL</label>
        <input id="link-url" type="text" placeholder="https://example.com">
        <button id="link-add" class="btn btn-navy">Add Link</button>
        <p id="link-msg" class="msg" role="alert"></p>
        <div id="link-list" class="link-list"></div>
      </article>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
